<app-toast></app-toast>

@if (loadingService.isLoading()) {
  <div class="global-progress-bar">
    <div class="progress-indicator"></div>
  </div>
  <div class="global-api-badge">
    <i class="pi pi-spin pi-spinner text-cyan"></i>
    <span>Syncing...</span>
  </div>
}

@if (isStandalonePage()) {
  <router-outlet></router-outlet>
} @else {
  <div class="app-layout">
    <app-sidebar></app-sidebar>
    <div class="main-wrapper">
      <app-topbar></app-topbar>
      <main class="content-area" [class.collapsed]="layoutService.isSidebarCollapsed()">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
}
